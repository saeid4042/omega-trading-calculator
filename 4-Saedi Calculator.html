<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saeedi Position Management Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            direction: ltr;
        }
        .calculator-container {
            background-color: #2c2c2c;
            border: 2px solid #ff8c00;
            border-radius: 10px;
            width: 380px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            color: #ff8c00;
            margin-bottom: 20px;
            font-size: 22px;
        }
        .section-title {
            background-color: #ff8c00;
            color: #000;
            padding: 8px;
            text-align: center;
            font-weight: bold;
            border-radius: 5px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        .form-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        label {
            font-size: 14px;
            color: #dda7ff;
            text-align: left;
        }
        select, input[type="text"] {
            width: 55%;
            padding: 6px;
            border-radius: 4px;
            border: 1px solid #555;
            background-color: #3b3b3b;
            color: #fff;
            font-size: 13px;
            text-align: left;
        }
        .btn-calc {
            width: 100%;
            background-color: #ff8c00;
            color: #000;
            font-weight: bold;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
            font-size: 15px;
            transition: background 0.3s;
            box-sizing: border-box;
        }
        .btn-calc:hover {
            background-color: #e07b00;
        }
        .result-box {
            width: 100%;
            background-color: #cc0000;
            color: #fff;
            text-align: center;
            padding: 10px;
            font-weight: bold;
            border-radius: 5px;
            margin-top: 15px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .enhancer-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding: 8px;
            background-color: #333;
            border-radius: 5px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="calculator-container">
    <h2>Position Management</h2>

    <!-- بخش اول: ماتریس تصمیم -->
    <div class="form-group">
        <label>Zone:</label>
        <select id="cbozone" onchange="runAllCalculations()">
            <option value="">-- Select --</option>
            <option value="Supply">Supply</option>
            <option value="Demand">Demand</option>
        </select>
    </div>

    <div class="form-group">
        <label>Curve:</label>
        <select id="cbocurve" onchange="runAllCalculations()">
            <option value="">-- Select --</option>
            <option value="Upper">Upper</option>
            <option value="Middle">Middle</option>
            <option value="Lower">Lower</option>
        </select>
    </div>

    <div class="form-group">
        <label>Trend:</label>
        <select id="cbotrend" onchange="runAllCalculations()">
            <option value="">-- Select --</option>
            <option value="UpTrend">UpTrend</option>
            <option value="DownTrend">DownTrend</option>
            <option value="Range">Range</option>
        </select>
    </div>

    <button class="btn-calc" onclick="runAllCalculations()">Decision Matrix</button>
    <div id="txtDM" class="result-box">Please select Items</div>

    <div style="margin-top: 20px;" class="section-title">Please select Items</div>

    <!-- آیتم‌های ارزیابی امتیاز -->
    <div class="form-group">
        <label>Freshness:</label>
        <select id="cbo11" onchange="runAllCalculations()">
            <option value="">-- Select --</option>
            <option value="Fresh">Fresh</option>
            <option value="1 Contact">1 Contact</option>
            <option value="> 1 Contact">> 1 Contact</option>
        </select>
    </div>

    <div class="form-group">
        <label>Profit Margin:</label>
        <select id="cbo22" onchange="runAllCalculations()">
            <option value="">-- Select --</option>
            <option value="< 3">&lt; 3</option>
            <option value="3 To 5">3 To 5</option>
            <option value="> 5">> 5</option>
        </select>
    </div>

    <div class="form-group">
        <label>Strength:</label>
        <select id="cbo33" onchange="runAllCalculations()">
            <option value="">-- Select --</option>
            <option value="Weak">Weak</option>
            <option value="Strong">Strong</option>
            <option value="Strongest">Strongest</option>
        </select>
    </div>

    <div class="form-group">
        <label>Time:</label>
        <select id="cbo44" onchange="runAllCalculations()">
            <option value="">-- Select --</option>
            <option value="> 6 Candle">> 6 Candle</option>
            <option value="4 To 6 Candle">4 To 6 Candle</option>
            <option value="<= 3 Candle">&lt;= 3 Candle</option>
        </select>
    </div>

    <div class="form-group">
        <label>Curve:</label>
        <select id="cbo55" onchange="runAllCalculations()">
            <option value="">-- Select --</option>
            <option value="Near to Zone">Near to Zone</option>
            <option value="Middle Curve">Middle Curve</option>
            <option value="Far from Zone">Far from Zone</option>
        </select>
    </div>

    <div class="form-group">
        <label>Trend:</label>
        <select id="cbo66" onchange="runAllCalculations()">
            <option value="">-- Select --</option>
            <option value="Up Trend">Up Trend</option>
            <option value="Range">Range</option>
            <option value="Down Trend">Down Trend</option>
        </select>
    </div>

    <!-- نمایش امتیازها -->
    <div class="enhancer-display">
        <label style="color: #fff;">ODs Enhancer (Score):</label>
        <span id="Text21" style="font-weight: bold; color: #ff8c00;">0.00</span>
    </div>

    <button class="btn-calc" onclick="runAllCalculations()">Calc OE Score</button>

    <div id="txt_OE" class="result-box">Do not Trade!!!!</div>
</div>

<script>
function runAllCalculations() {
    let cbo11 = document.getElementById('cbo11').value;
    let val1 = 0;
    if (cbo11 === 'Fresh') val1 = 3;
    else if (cbo11 === '1 Contact') val1 = 1.5;
    
    let cbo22 = document.getElementById('cbo22').value;
    let val2 = 0;
    if (cbo22 === '3 To 5') val2 = 1.5;
    else if (cbo22 === '> 5') val2 = 3;

    let cbo33 = document.getElementById('cbo33').value;
    let val3 = 0;
    if (cbo33 === 'Strong') val3 = 1;
    else if (cbo33 === 'Strongest') val3 = 2;

    let cbo44 = document.getElementById('cbo44').value;
    let val4 = 0;
    if (cbo44 === '4 To 6 Candle') val4 = 1;
    else if (cbo44 === '<= 3 Candle') val4 = 2;

    let cbo55 = document.getElementById('cbo55').value;
    let val5 = 0;
    if (cbo55 === 'Middle Curve') val5 = 1;
    else if (cbo55 === 'Near to Zone') val5 = 2;

    let cbo66 = document.getElementById('cbo66').value;
    let zone = document.getElementById('cbozone').value;
    let val6 = 0;
    if (cbo66 === 'Up Trend' && zone === 'Demand') val6 = 1;
    else if (cbo66 === 'Down Trend' && zone === 'Supply') val6 = 1;
    else if (cbo66 === 'Range') val6 = 0.5;

    let sumScore = val1 + val2 + val3 + val4 + val5 + val6;
    let finalScore = (sumScore / 13) * 10;
    document.getElementById('Text21').innerText = finalScore.toFixed(2);

    let oeBox = document.getElementById('txt_OE');
    if (sumScore === 0 && !cbo11 && !cbo22) {
        oeBox.innerText = "Do not Trade!!!!";
        oeBox.style.color = "#fff";
        oeBox.style.backgroundColor = "#cc0000";
    } else if (finalScore >= 9) {
        oeBox.innerText = "BUY / SELL (Proximal Entry)";
        oeBox.style.color = "#fff";
        oeBox.style.backgroundColor = "#009900";
    } else if (finalScore >= 7 && finalScore < 9) {
        oeBox.innerText = "BUY / SELL (Confirmation Entry)";
        oeBox.style.color = "#000";
        oeBox.style.backgroundColor = "#ffcc00";
    } else {
        oeBox.innerText = "Do not Trade!!!!";
        oeBox.style.color = "#fff";
        oeBox.style.backgroundColor = "#cc0000";
    }

    let curve = document.getElementById('cbocurve').value;
    let trend = document.getElementById('cbotrend').value;
    let dmBox = document.getElementById('txtDM');

    if (!zone || !curve || !trend) {
        dmBox.innerText = "Please select Items";
        dmBox.style.color = "#fff";
        dmBox.style.backgroundColor = "#cc0000";
    } else if (zone === "Supply" && curve === "Upper" && (trend === "DownTrend" || trend === "Range")) {
        dmBox.innerText = "SELL";
        dmBox.style.color = "#fff";
        dmBox.style.backgroundColor = "#009900";
    } else if (zone === "Supply" && curve === "Upper" && trend === "UpTrend") {
        dmBox.innerText = "SELL (Caution)";
        dmBox.style.color = "#000";
        dmBox.style.backgroundColor = "#ffcc00";
    } else if (zone === "Supply" && curve === "Middle" && (trend === "DownTrend" || trend === "Range")) {
        dmBox.innerText = "SELL";
        dmBox.style.color = "#fff";
        dmBox.style.backgroundColor = "#009900";
    } else if (zone === "Supply" && curve === "Lower" && trend === "DownTrend") {
        dmBox.innerText = "SELL (Caution)";
        dmBox.style.color = "#000";
        dmBox.style.backgroundColor = "#ffcc00";
    } else if (zone === "Demand" && curve === "Lower" && (trend === "UpTrend" || trend === "Range")) {
        dmBox.innerText = "BUY";
        dmBox.style.color = "#fff";
        dmBox.style.backgroundColor = "#009900";
    } else if (zone === "Demand" && curve === "Lower" && trend === "DownTrend") {
        dmBox.innerText = "BUY (Caution)";
        dmBox.style.color = "#000";
        dmBox.style.backgroundColor = "#ffcc00";
    } else if (zone === "Demand" && curve === "Middle" && (trend === "UpTrend" || trend === "Range")) {
        dmBox.innerText = "BUY";
        dmBox.style.color = "#fff";
        dmBox.style.backgroundColor = "#009900";
    } else if (zone === "Demand" && curve === "Upper" && trend === "UpTrend") {
        dmBox.innerText = "BUY (Caution)";
        dmBox.style.color = "#000";
        dmBox.style.backgroundColor = "#ffcc00";
    } else {
        dmBox.innerText = "Do not Trade";
        dmBox.style.color = "#fff";
        dmBox.style.backgroundColor = "#cc0000";
    }
}
</script>

</body>
</html>
